# Security headers for the Developer Console SPA (CSP + framing / sniffing /
# referrer), included from nginx.conf's app-shell + SPA-fallback locations.
#
# This is the BAKED DEFAULT (Dragon testnet hosts), so the image works standalone.
# In k8s the cef-developer-console Helm chart mounts a per-environment copy over
# this file at /etc/nginx/csp.conf, with the CSP host list rendered from its
# values -- so the host list is not baked into the image (#188 review).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.dragon-1.xyz https://*.ddcdragon.com; connect-src 'self' https://*.ddcdragon.com https://*.dragon-1.xyz https://*.cere.network wss://*.ddcdragon.com wss://*.dragon-1.xyz wss://*.cere.network; frame-src 'self' https://*.ddcdragon.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
