# nginx config for the Developer Console SPA (static single-page app served from /).
server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Liveness/readiness probe target for Kubernetes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime config and the app shell must never be cached: a deploy that
    # swaps config.js (the mounted ConfigMap) or index.html takes effect at once.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Content-hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths render the app shell so client-side
    # routing (React Router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
