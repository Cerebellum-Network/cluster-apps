# nginx config for the Developer Console SPA (static single-page app served from /).
server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Liveness/readiness probe target for Kubernetes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime config and the app shell must never be cached: a deploy that
    # swaps config.js (the mounted ConfigMap) or index.html takes effect at once.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        # Security headers on the app shell. connect-src/frame-src cover the Cere
        # DDC + CEF wallet hosts the SPA talks to (wallet iframe, S3 gateway,
        # blockchain index/CDN, chain WS); tune per-env if hosts move. style/font
        # allow MUI/emotion inline styles + Google Fonts; img allows blob/data
        # (QR codes, object-URL downloads).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.dragon-1.xyz https://*.ddcdragon.com; connect-src 'self' https://*.ddcdragon.com https://*.dragon-1.xyz https://*.cere.network wss://*.ddcdragon.com wss://*.dragon-1.xyz wss://*.cere.network; frame-src 'self' https://*.ddcdragon.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths render the app shell so client-side
    # routing (React Router) can take over. Same security headers as /index.html
    # (nginx add_header does not inherit into a location that sets its own).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.dragon-1.xyz https://*.ddcdragon.com; connect-src 'self' https://*.ddcdragon.com https://*.dragon-1.xyz https://*.cere.network wss://*.ddcdragon.com wss://*.dragon-1.xyz wss://*.cere.network; frame-src 'self' https://*.ddcdragon.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
