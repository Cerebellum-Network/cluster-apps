# Security headers for the Cluster Console SPA, included from nginx.conf. The
# baked default allows the Dragon hosts; the cef-cluster-console Helm chart
# mounts a per-environment copy over /etc/nginx/csp.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.ddcdragon.com https://*.dragon-1.xyz wss://*.ddcdragon.com; frame-src 'self' https://*.ddcdragon.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
